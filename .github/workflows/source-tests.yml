name: RichardOS source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests and script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Java syntax parser
        run: python3 -m pip install --disable-pip-version-check javalang

      - name: Parse Font Studio Java source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import javalang

          source = Path(
              "vendor/richardos/fontstudio/src/com/richardos/fontstudio/FontStudioActivity.java"
          ).read_text()
          tree = javalang.parse.parse(source)
          assert tree.package.name == "com.richardos.fontstudio"
          assert any(
              item.name == "FontStudioActivity"
              for item in tree.types
          )
          print("Font Studio Java syntax: OK")
          PY

      - name: Check out LineageOS manifest
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android
          ref: lineage-24.0
          path: upstream/manifest
          sparse-checkout: |
            default.xml
            snippets/lineage.xml
          sparse-checkout-cone-mode: false

      - name: Audit device manifest dependencies
        run: |
          python3 scripts/audit_manifest_dependencies.py \
            manifests/mojito-lineage24.xml \
            upstream/manifest/default.xml \
            upstream/manifest/snippets/lineage.xml

      - name: Check out LineageOS generic device definitions
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_device_generic_common
          ref: lineage-24.0
          path: upstream/device-generic-common
          sparse-checkout: |
            gsi_arm64.mk
          sparse-checkout-cone-mode: false

      - name: Validate experimental GSI metadata against upstream product
        run: python3 scripts/check-gsi-config.py upstream/device-generic-common/gsi_arm64.mk

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check out LineageOS netd target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_system_netd
          ref: lineage-24.0
          path: upstream/system_netd

      - name: Check Android 17 GSI netd compatibility patch
        run: |
          PATCH="$GITHUB_WORKSPACE/patches/treble/platform_system_netd/0001-netd-legacy-kernel-oneshot-nonfatal.patch"
          git -C upstream/system_netd apply --check "$PATCH"
          git -C upstream/system_netd apply "$PATCH"
          git -C upstream/system_netd diff --check

      - name: Check out LineageOS bionic target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_bionic
          ref: lineage-24.0
          path: upstream/bionic
          sparse-checkout: |
            libc/bionic/sys_epoll.cpp
          sparse-checkout-cone-mode: false

      - name: Check Android 17 legacy-kernel epoll fallback patch
        run: |
          PATCH="$GITHUB_WORKSPACE/patches/treble/platform_bionic/0001-epoll-pwait2-fallback-legacy-kernels.patch"
          git -C upstream/bionic apply --check "$PATCH"
          git -C upstream/bionic apply "$PATCH"
          git -C upstream/bionic diff --check

      - name: Check out LineageOS frameworks_av target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_frameworks_av
          ref: lineage-24.0
          path: upstream/frameworks_av
          sparse-checkout: |
            camera/CameraParameters.cpp
            media/libmedia/MediaProfiles.cpp
          sparse-checkout-cone-mode: false

      - name: Check generic camera parameter null guard patch
        run: |
          PATCH="$GITHUB_WORKSPACE/patches/treble/platform_frameworks_av/0001-camera-parameters-null-guard.patch"
          git -C upstream/frameworks_av apply --check "$PATCH"
          git -C upstream/frameworks_av apply "$PATCH"
          git -C upstream/frameworks_av diff --check

      - name: Check out LineageOS Settings target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_packages_apps_Settings
          ref: lineage-24.0
          path: upstream/Settings

      - name: Check out LineageOS framework target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_frameworks_base
          ref: lineage-24.0
          path: upstream/frameworks_base
          sparse-checkout: |
            core/java/android/provider/Settings.java
            core/java/android/os/storage/StorageManager.java
            core/java/android/os/SELinux.java
            core/java/android/os/SystemProperties.java
            packages/SystemUI/src/com/android/systemui/theme/ThemeOverlayApplier.java
          sparse-checkout-cone-mode: false

      - name: Check out LineageOS SDK target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_lineage-sdk
          ref: lineage-24.0
          path: upstream/lineage-sdk

      - name: Audit RichardOS Lineage settings API
        run: |
          python3 scripts/audit_lineage_settings_api.py \
            upstream/lineage-sdk/sdk/src/java/lineageos/providers/LineageSettings.java \
            patches/lineage/Settings/0001-settings-add-richardos-dashboard.patch

      - name: Audit RichardOS Android framework API
        run: |
          python3 scripts/audit_settings_integration.py \
            upstream/Settings upstream/frameworks_base \
            patches/lineage/Settings/0001-settings-add-richardos-dashboard.patch \
            upstream/lineage-sdk/sdk/src/java/lineageos/providers/LineageSettings.java

      - name: Check RichardOS patch applicability
        run: |
          PATCH="$GITHUB_WORKSPACE/patches/lineage/Settings/0001-settings-add-richardos-dashboard.patch"
          git -C upstream/Settings apply --check "$PATCH"
          git -C upstream/Settings apply "$PATCH"
          git -C upstream/Settings diff --check

      - name: Compile Python scripts
        run: python3 -m compileall -q scripts tests

      - name: Check shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)


  fontstudio-android-api-compile:
    name: Compile Font Studio against Android SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compile and package a smoke-test APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_PLATFORM="$ANDROID_HOME/platforms/android-35"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          WORK="$RUNNER_TEMP/fontstudio-apk"
          mkdir -p "$WORK/classes" "$WORK/dex" "$WORK/generated"

          javac \
            -source 8 \
            -target 8 \
            -bootclasspath "$SDK_PLATFORM/android.jar" \
            -d "$WORK/classes" \
            vendor/richardos/fontstudio/src/com/richardos/fontstudio/FontStudioActivity.java

          "$BUILD_TOOLS/aapt2" link \
            -I "$SDK_PLATFORM/android.jar" \
            --manifest vendor/richardos/fontstudio/AndroidManifest.xml \
            --min-sdk-version 29 \
            --target-sdk-version 35 \
            --java "$WORK/generated" \
            -o "$WORK/FontStudio-unsigned.apk"

          find "$WORK/classes" -name '*.class' -print0 | \
            xargs -0 "$BUILD_TOOLS/d8" \
              --lib "$SDK_PLATFORM/android.jar" \
              --min-api 29 \
              --output "$WORK/dex"

          cd "$WORK/dex"
          zip -q "$WORK/FontStudio-unsigned.apk" classes.dex
          cd "$WORK"

          keytool -genkeypair -v \
            -keystore "$WORK/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$WORK/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$WORK/RichardOSFontStudio-smoke.apk" \
            "$WORK/FontStudio-unsigned.apk"

          "$BUILD_TOOLS/apksigner" verify "$WORK/RichardOSFontStudio-smoke.apk"
          test -s "$WORK/RichardOSFontStudio-smoke.apk"

      - name: Install and launch smoke APK in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$RUNNER_TEMP/fontstudio-apk/RichardOSFontStudio-smoke.apk"
            adb install "$APK"
            adb shell am start -W -n com.richardos.fontstudio/.FontStudioActivity
            adb shell pidof com.richardos.fontstudio
            adb shell dumpsys activity activities | grep -F "com.richardos.fontstudio/.FontStudioActivity"
            adb shell am force-stop com.richardos.fontstudio
      - name: Upload smoke-test APK
        uses: actions/upload-artifact@v4
        with:
          name: richardos-fontstudio-smoke-apk
          path: ${{ runner.temp }}/fontstudio-apk/RichardOSFontStudio-smoke.apk
          if-no-files-found: error
          retention-days: 7
