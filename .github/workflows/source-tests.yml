name: RichardOS source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests and script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check out LineageOS manifest
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android
          ref: lineage-24.0
          path: upstream/manifest
          sparse-checkout: |
            default.xml
            snippets/lineage.xml
          sparse-checkout-cone-mode: false

      - name: Audit device manifest dependencies
        run: |
          python3 scripts/audit_manifest_dependencies.py \
            manifests/mojito-lineage24.xml \
            upstream/manifest/default.xml \
            upstream/manifest/snippets/lineage.xml

      - name: Check out LineageOS generic device definitions
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_device_generic_common
          ref: lineage-24.0
          path: upstream/device-generic-common
          sparse-checkout: |
            gsi_arm64.mk
          sparse-checkout-cone-mode: false

      - name: Validate experimental GSI metadata against upstream product
        run: python3 scripts/check-gsi-config.py upstream/device-generic-common/gsi_arm64.mk

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v


      - name: Check out LineageOS netd target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_system_netd
          ref: lineage-24.0
          path: upstream/system_netd

      - name: Check Android 17 GSI netd compatibility patch
        run: |
          PATCH="$GITHUB_WORKSPACE/patches/treble/platform_system_netd/0001-netd-legacy-kernel-oneshot-nonfatal.patch"
          git -C upstream/system_netd apply --check "$PATCH"
          git -C upstream/system_netd apply "$PATCH"
          git -C upstream/system_netd diff --check
      - name: Check out LineageOS bionic target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_bionic
          ref: lineage-24.0
          path: upstream/bionic
          sparse-checkout: |
            libc/bionic/sys_epoll.cpp
          sparse-checkout-cone-mode: false

      - name: Check Android 17 legacy-kernel epoll fallback patch
        run: |
          PATCH="$GITHUB_WORKSPACE/patches/treble/platform_bionic/0001-epoll-pwait2-fallback-legacy-kernels.patch"
          git -C upstream/bionic apply --check "$PATCH"
          git -C upstream/bionic apply "$PATCH"
          git -C upstream/bionic diff --check

      - name: Check out LineageOS Settings target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_packages_apps_Settings
          ref: lineage-24.0
          path: upstream/Settings

      - name: Check out LineageOS framework target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_frameworks_base
          ref: lineage-24.0
          path: upstream/frameworks_base
          sparse-checkout: |
            core/java/android/provider/Settings.java
            core/java/android/os/storage/StorageManager.java
            core/java/android/os/SELinux.java
            core/java/android/os/SystemProperties.java
            packages/SystemUI/src/com/android/systemui/theme/ThemeOverlayApplier.java
          sparse-checkout-cone-mode: false

      - name: Check out LineageOS SDK target
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_lineage-sdk
          ref: lineage-24.0
          path: upstream/lineage-sdk

      - name: Audit RichardOS Lineage settings API
        run: |
          python3 scripts/audit_lineage_settings_api.py \
            upstream/lineage-sdk/sdk/src/java/lineageos/providers/LineageSettings.java \
            patches/lineage/Settings/0001-settings-add-richardos-dashboard.patch

      - name: Audit RichardOS Android framework API
        run: |
          python3 scripts/audit_settings_integration.py \
            upstream/Settings upstream/frameworks_base \
            patches/lineage/Settings/0001-settings-add-richardos-dashboard.patch \
            upstream/lineage-sdk/sdk/src/java/lineageos/providers/LineageSettings.java

      - name: Check RichardOS patch applicability
        run: |
          PATCH="$GITHUB_WORKSPACE/patches/lineage/Settings/0001-settings-add-richardos-dashboard.patch"
          git -C upstream/Settings apply --check "$PATCH"
          git -C upstream/Settings apply "$PATCH"
          git -C upstream/Settings diff --check

      - name: Compile Python scripts
        run: python3 -m compileall -q scripts tests

      - name: Check shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
