name: RichardOS GSI build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gsi:
    env:
      ANDROID_BUILD_TOP: ${{ vars.ANDROID_BUILD_TOP }}
    # Android source builds need a dedicated Linux runner with substantial RAM and disk.
    runs-on: [self-hosted, linux, x64, android-build]
    timeout-minutes: 360
    steps:
      - name: Check out RichardOS build scripts
        uses: actions/checkout@v5
        with:
          path: RichardOS

      - name: Validate build host and source tree
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_BUILD_TOP:?Set the repository Actions variable ANDROID_BUILD_TOP to the absolute path of the pre-synced LineageOS 24.0 source tree on the self-hosted runner}"
          cd "$ANDROID_BUILD_TOP"
          test -f build/envsetup.sh
          test -f device/generic/common/gsi_arm64.mk
          test -d .repo
          test "$(uname -m)" = "x86_64"
          cpu_count="$(nproc)"
          mem_gib="$(awk '/MemTotal/ {print int($2/1024/1024)}' /proc/meminfo)"
          free_gib="$(df -BG . | awk 'NR==2 {gsub(/G/, "", $4); print $4}')"
          echo "Runner: ${cpu_count} vCPU, ${mem_gib} GiB RAM, ${free_gib} GiB free disk"
          (( cpu_count >= 8 && mem_gib >= 28 && free_gib >= 300 )) || {
            echo "ERROR: need at least 8 vCPU, 28 GiB RAM and 300 GiB free disk; 16 vCPU / 64 GiB / 500 GiB NVMe recommended." >&2
            exit 2
          }

      - name: Build ARM64 GSI
        shell: bash
        env:
          OUT_DIR: ${{ vars.ANDROID_BUILD_TOP }}/out
        run: |
          set -euo pipefail
          bash RichardOS/scripts/build-gsi.sh

      - name: Upload GSI image and checksum
        uses: actions/upload-artifact@v4
        with:
          name: RichardOS-0.9.0-pre-gsi-arm64
          path: |
            ${{ vars.ANDROID_BUILD_TOP }}/out/target/product/generic_arm64/system.img
            ${{ vars.ANDROID_BUILD_TOP }}/out/target/product/generic_arm64/system.img.sha256
          if-no-files-found: error
          retention-days: 7
